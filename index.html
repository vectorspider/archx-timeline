<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ArchX</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;600&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100dvh;
      overflow-x: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
      font-family: 'Oswald', sans-serif;
      scroll-behavior: smooth;
      scroll-snap-type: y mandatory;
      background: #050914;
    }
    body::-webkit-scrollbar { display: none; }

    /* ══════════════════════════════════════════════════════
       HEADER
    ══════════════════════════════════════════════════════ */
    #site-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      height: 52px;
      overflow: hidden;
      background: #050914;
      border-bottom: 1px solid rgba(157,207,255,0.08);
      transition:
        height 0.6s cubic-bezier(0.25,1,0.2,1),
        background 0.3s ease,
        border-color 0.3s ease;
    }

    #site-header.open {
      height: 100dvh;
      background: transparent;
      border-bottom-color: transparent;
    }

    /* ── Single Centered Animating Logo ────────────────── */
    .header-logo {
      position: absolute;
      left: 50%;
      top: 26px; 
      transform: translate(-50%, -50%) scale(1);
      z-index: 20;
      
      font-size: 1.45rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      
      background: linear-gradient(110deg, #9dcfff 15%, #ffffff 30%, #ffffff 40%, #9dcfff 65%);
      background-size: 200% auto;
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
      
      filter: drop-shadow(0 0 4px rgba(157,207,255,0.4)) drop-shadow(0 0 10px rgba(11,37,64,0.8));

      user-select: none;
      pointer-events: none;
      opacity: 1;
      
      animation: logo-shimmer 4s linear infinite;

      transition:
        top 0.7s cubic-bezier(0.25,1,0.2,1),
        transform 0.7s cubic-bezier(0.25,1,0.2,1),
        letter-spacing 0.7s cubic-bezier(0.25,1,0.2,1),
        filter 0.7s cubic-bezier(0.25,1,0.2,1),
        opacity 0.5s ease;
    }

    @keyframes logo-shimmer {
      to { background-position: -200% center; }
    }

    #site-header.open .header-logo {
      top: 50%;
      transform: translate(-50%, -50%) scale(3.5);
      letter-spacing: 0.28em; 
      filter: drop-shadow(0 0 8px rgba(157,207,255,0.6)) drop-shadow(0 0 25px rgba(12,45,78,0.9));
    }

    #site-header:not(.is-paused) .header-logo {
      opacity: 0;
      transform: translate(-50%, -50%) scale(4); 
      letter-spacing: 0.45em; 
      filter: blur(6px); 
    }

    /* ── Bar row ───────────────────────── */
    .header-bar {
      position: relative;
      z-index: 10;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 24px;
      flex-shrink: 0;
      background: transparent; 
    }

    /* Collapse Nav Button */
    .header-chevron {
      width: 20px; height: 20px;
      opacity: 0.5;
      flex-shrink: 0;
      cursor: pointer;
      pointer-events: auto;
      transition: transform 0.38s cubic-bezier(0.25,1,0.2,1), opacity 0.2s ease;
    }
    
    @media (hover: hover) {
      .header-chevron:hover { opacity: 0.9; }
    }
    
    #site-header.open .header-chevron { transform: rotate(180deg); opacity: 0.85; }

    /* ── Video layer ──────────────────── */
    .header-player {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }
    #site-header.open .header-player { pointer-events: auto; }

    #hdr-wrapper {
      position: absolute;
      width: max(177.77dvh, 100vw);
      height: 130dvh;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) translateZ(0); 
      will-change: transform;
    }
    
    #hdr-video,
    #hdr-poster {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      pointer-events: none;
      
      transform: scale(1.15);
      transition: transform 0.8s cubic-bezier(0.25,1,0.2,1), opacity 1s ease-in-out;
    }
    #hdr-video  { opacity: 0; }
    #hdr-poster { opacity: 1; z-index: -1; }

    #site-header.open #hdr-video,
    #site-header.open #hdr-poster { transform: scale(1); }

    .hdr-overlay {
      position: absolute;
      inset: 0;
      z-index: 3;
      cursor: pointer;
    }

    /* ── Header Play/Pause Button Only Appears on Hover WHEN OPEN ── */
    .hdr-controls {
      position: absolute;
      bottom: 24px; left: 24px;
      z-index: 4;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    
    @media (hover: hover) {
      #site-header.open:hover .hdr-controls {
        opacity: 0.9;
        pointer-events: auto;
      }
    }

    .hdr-controls button {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 22px;
      font-family: 'Oswald', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      border: none;
      border-radius: 30px;
      background: linear-gradient(135deg, #0052a5, #003d80);
      color: rgba(255,255,255,0.92);
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,50,100,0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
      opacity: 0.85;
    }
    @media (hover: hover) {
      .hdr-controls button:hover  { transform: scale(1.05); box-shadow: 0 6px 20px rgba(0,50,100,0.6); opacity: 1; }
    }
    .hdr-controls button:active { transform: scale(0.96); }

    /* ══════════════════════════════════════════════════════
       MIDDLE TIMELINE SECTION (REPLACES PLACEHOLDER TEXT)
    ══════════════════════════════════════════════════════ */
    .header-spacer { height: 52px; flex-shrink: 0; }

    .timeline-section {
      position: relative;
      height: 100dvh;
      width: 100%;
      background: #02060f;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      overflow: hidden;
      border-top: 1px solid rgba(157,207,255,0.07);
      border-bottom: 1px solid rgba(157,207,255,0.07);
    }

    .timeline-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #02060f;
    }

    /* ── Section 2 ─────────────────────────────────────── */
    .parallax-video {
      position: relative;
      height: 100dvh;
      overflow: hidden;
      z-index: 1;
      scroll-snap-align: start;
      scroll-snap-stop: always;
    }
    .video-wrapper {
      position: absolute;
      width: max(177.77dvh, 100vw);
      height: 130dvh;
      top: -15dvh;
      left: 50%;
      transform: translate(-50%, 0) translateZ(0);
      z-index: -1;
      will-change: transform;
    }
    .video-wrapper video,
    .video-wrapper img {
      width: 100%; height: 100%;
      object-fit: cover;
      pointer-events: none;
      position: absolute;
      top: 0; left: 0;
    }
    .video-wrapper video { opacity: 0; transition: opacity 1s ease-in-out; }
    .video-wrapper img   { opacity: 1; transition: opacity 1s ease-in-out; z-index: -1; }

    .overlay {
      position: absolute;
      inset: 0; z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* ── Section 2 Play/Pause Button Only Appears on Hover ── */
    .controls {
      position: absolute;
      bottom: 24px; left: 24px;
      z-index: 3;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    
    @media (hover: hover) {
      .parallax-video:hover .controls {
        opacity: 0.9;
        pointer-events: auto;
      }
    }

    .controls button {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 22px;
      font-family: 'Oswald', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      border: none;
      border-radius: 30px;
      background: linear-gradient(135deg, #0052a5, #003d80);
      color: rgba(255,255,255,0.92);
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,50,100,0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
      opacity: 0.85;
    }
    @media (hover: hover) {
      .controls button:hover  { transform: scale(1.05); box-shadow: 0 6px 20px rgba(0,50,100,0.6); opacity: 1; }
    }
    .controls button:active { transform: scale(0.96); }
  </style>
</head>

                ctx.beginPath(); ctx.arc(px, py, Math.max(0.4, star.radius * DPR), 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${star.cr},${star.cg},${star.cb},${opacity})`; ctx.fill();
                if (totalGlow > 0.5) ctx.shadowBlur = 0;
              });

              if (Math.random() < 0.008) shooters.push({ x: Math.random() * canvas.width, y: -canvas.height * 0.15, len: (80 + Math.random() * 140) * DPR, spd: (10 + Math.random() * 14) * DPR, angle: Math.PI / 4 + (Math.random() * 0.2 - 0.1), op: 1.0 });
              for (let i = shooters.length - 1; i >= 0; i--) {
                let ss = shooters[i]; ss.x += Math.cos(ss.angle) * ss.spd; ss.y += Math.sin(ss.angle) * ss.spd; ss.op -= 0.014;
                if (ss.op <= 0 || ss.x > canvas.width || ss.y > canvas.height) { shooters.splice(i, 1); continue; }
                const tx = ss.x - Math.cos(ss.angle) * ss.len, ty = ss.y - Math.sin(ss.angle) * ss.len;
                const g = ctx.createLinearGradient(ss.x, ss.y, tx, ty); g.addColorStop(0, `rgba(255,255,255,${ss.op})`); g.addColorStop(1, "rgba(255,255,255,0)");
                ctx.beginPath(); ctx.moveTo(ss.x, ss.y); ctx.lineTo(tx, ty); ctx.strokeStyle = g; ctx.lineWidth = 1.5 * DPR; ctx.lineCap = "round"; ctx.stroke();
              }

              cards.forEach((card, i) => {
                const absoluteZ = i * SCROLL_PER_CARD; const distance = absoluteZ - scrollY;
                let scale = 1, opacity = 0, yOffset = 0, blurAmount = 0;
                if (distance < 0) {
                  scale = 1 + (Math.abs(distance) / 500); opacity = 1 - (Math.abs(distance) / 250); yOffset = distance * 1.8; blurAmount = Math.min(20, Math.abs(distance) / 15); 
                } else {
                  scale = 1000 / (1000 + distance); opacity = 1 - (distance / 3000); yOffset = distance * 0.15; blurAmount = Math.max(0, (distance - FOCUS_ZONE) / 80);
                }
                let centerFactor = Math.max(0, Math.min(1, (Math.abs(distance) - FOCUS_ZONE) / 200));
                let currentXOffset = card.maxOffset * (centerFactor * centerFactor * (3 - 2 * centerFactor));

                if (Math.abs(distance) <= FOCUS_ZONE) { card.el.classList.add("in-focus"); blurAmount = 0; } else { card.el.classList.remove("in-focus"); }

                if (opacity > 0) {
                  card.el.style.display = "flex"; card.el.style.transform = `translate3d(calc(-50% + ${currentXOffset}px), calc(-50% + ${yOffset}px), 0) scale(${scale})`; card.el.style.opacity = opacity; card.el.style.filter = `blur(${blurAmount}px)`; card.el.style.zIndex = events.length - Math.floor(Math.abs(distance));
                } else { card.el.style.display = "none"; }
              });

              requestAnimationFrame(renderLoop);
            }
            init();
          });
        </script>

  <div class="parallax-video is-paused" id="section2">
    <div class="video-wrapper" id="wrapper2">
      <video id="video2" loop muted playsinline preload="none">
        <source src="https://vectorvortex.github.io/parallax-video/MB.mp4" type="video/mp4" />
      </video>
      <img id="poster2"
           src="https://vectorvortex.github.io/parallax-video/BOSTON.jpg"
           alt="Section 2" loading="lazy">
    </div>
    <div class="overlay" id="overlay2"></div>
    <div class="controls" id="controls2">
      <button id="btn2">
        <svg id="icon2" width="13" height="13" viewBox="0 0 24 24" fill="white">
          <polygon points="5,3 19,12 5,21"/>
        </svg>
        Play
      </button>
    </div>
  </div>

<script>
  const PLAY_PATH  = '<polygon points="5,3 19,12 5,21"/>';
  const PAUSE_PATH = '<rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/>';

  const hdr        = document.getElementById('site-header');
  const hdrWrapper = document.getElementById('hdr-wrapper');
  const hdrVideo   = document.getElementById('hdr-video');
  const hdrPoster  = document.getElementById('hdr-poster');
  const hdrOverlay = document.getElementById('hdr-overlay');
  const hdrIcon    = document.getElementById('hdr-icon');
  const hdrBtn     = document.getElementById('hdr-btn');
  const chevronBtn = document.getElementById('hdr-chevron');

  const sec2 = {
    section: document.getElementById('section2'),
    wrapper: document.getElementById('wrapper2'),
    video:   document.getElementById('video2'),
    poster:  document.getElementById('poster2'),
    overlay: document.getElementById('overlay2'),
    icon:    document.getElementById('icon2'),
    speed:   0.3,
    topOffset: 0
  };

  function safePlay(video) {
    if (video.readyState === 0) video.load(); 
    video.muted = false;
    return video.play().catch(() => {
      video.muted = true;
      return video.play().catch(() => {});
    });
  }

  function setHdrState(playing) {
    hdrVideo.style.opacity  = playing ? '1' : '0';
    hdrPoster.style.opacity = playing ? '0' : '1';
    hdr.classList.toggle('is-paused', !playing);
    hdrIcon.innerHTML = playing ? PAUSE_PATH : PLAY_PATH;
    hdrBtn.lastChild.textContent = playing ? ' Pause' : ' Play';
  }

  hdrVideo.addEventListener('play',  () => setHdrState(true));
  hdrVideo.addEventListener('pause', () => setHdrState(false));
  setHdrState(false); 

  function pauseHdr() {
    if (!hdrVideo.paused) { hdrVideo.pause(); hdrVideo.muted = true; }
  }

  function toggleHdr() {
    if (hdrVideo.paused) {
      pauseSec2();
      safePlay(hdrVideo);
    } else {
      pauseHdr();
    }
  }

  hdrOverlay.addEventListener('click', toggleHdr);
  hdrBtn.addEventListener('click', toggleHdr);
  
  hdr.addEventListener('mouseenter', () => {
    if (!hdr.classList.contains('is-force-closed')) {
      hdr.classList.add('open');
    }
  });

  hdr.addEventListener('mouseleave', () => {
    hdr.classList.remove('open');
    hdr.classList.remove('is-force-closed'); 
    pauseHdr();
  });

  chevronBtn.addEventListener('click', (e) => {
    e.stopPropagation(); 
    if (hdr.classList.contains('open')) {
      hdr.classList.remove('open');
      hdr.classList.add('is-force-closed');
      pauseHdr();
    } else {
      hdr.classList.add('open');
      hdr.classList.remove('is-force-closed');
    }
  });

  function setSec2State(playing) {
    sec2.video.style.opacity  = playing ? '1' : '0';
    sec2.poster.style.opacity = playing ? '0' : '1';
    sec2.overlay.classList.toggle('hidden', playing);
    sec2.section.classList.toggle('is-paused', !playing);
    sec2.icon.innerHTML = playing ? PAUSE_PATH : PLAY_PATH;
    sec2.icon.closest('button').lastChild.textContent = playing ? ' Pause' : ' Play';
  }

  sec2.video.addEventListener('play',  () => setSec2State(true));
  sec2.video.addEventListener('pause', () => setSec2State(false));
  setSec2State(false);

  function pauseSec2() {
    if (!sec2.video.paused) { sec2.video.pause(); sec2.video.muted = true; }
  }

  function toggleSec2() {
    if (sec2.video.paused) {
      pauseHdr();
      safePlay(sec2.video);
    } else {
      pauseSec2();
    }
  }

  sec2.overlay.addEventListener('click', toggleSec2);
  document.getElementById('btn2').addEventListener('click', toggleSec2);

  const HDR_SPEED  = 0.6;
  const SEC2_SPEED = 0.3;
  let ticking = false;

  function updateLayoutCache() {
    sec2.topOffset = sec2.section.offsetTop;
  }
  
  window.addEventListener('load', updateLayoutCache);
  window.addEventListener('resize', updateLayoutCache, { passive: true });

  window.addEventListener('scroll', () => {
    if (!ticking) {
      window.requestAnimationFrame(() => {
        const scrollY = window.scrollY;
        
        const hdrOffset = scrollY * HDR_SPEED;
        hdrWrapper.style.transform = `translate(-50%, calc(-50% + ${hdrOffset}px)) translateZ(0)`;

        const s2offset = (scrollY - sec2.topOffset) * SEC2_SPEED;
        sec2.wrapper.style.transform = `translate(-50%, calc(-15dvh + ${s2offset}px)) translateZ(0)`;
        
        ticking = false;
      });
      ticking = true;
    }
  }, { passive: true });

  new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting && !sec2.video.paused) {
        pauseSec2();
      }
    });
  }, { threshold: 0.2 }).observe(sec2.section);
</script>
</body>
</html>
